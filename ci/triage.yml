name: Triage Inbox CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  triage-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline Sanity Check
        run: |
          python -c "from src.fixtures import load_all; cases = load_all('evalcases/cases'); print(f'Successfully loaded {len(cases)} benchmark cases.')"

      - name: Run Triage Verification Suite
        env:
          TRIAGE_PROVIDER: ${{ secrets.TRIAGE_PROVIDER || 'openai' }}
          TRIAGE_MODEL: ${{ secrets.TRIAGE_MODEL || 'gpt-4o-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python eval.py --limit 2
